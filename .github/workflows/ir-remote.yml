name: Build IR Remote APK
on:
  push:
    paths: ['ir-remote/**', '.github/workflows/ir-remote.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ir-remote } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk Remote.apk
      - uses: actions/upload-artifact@v4
        with: { name: Remote-apk, path: ir-remote/Remote.apk }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete ir-remote-latest --cleanup-tag -y --repo "${{ github.repository }}" || true
          gh release create ir-remote-latest Remote.apk --title "Remote (TV + AC) v2.0.${{ github.run_number }}" --notes "IR remote for TVs and Samsung/LG air conditioners." --repo "${{ github.repository }}"
