name: Build Dark Tiles APK
on:
  push:
    paths: ['dark-tiles/**', '.github/workflows/dark-tiles.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dark-tiles } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: DarkTiles-apk, path: dark-tiles/app/build/outputs/apk/debug/*.apk }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DarkTiles.apk
          gh release delete dark-tiles-latest --cleanup-tag -y || true
          gh release create dark-tiles-latest DarkTiles.apk --title "Dark Tiles icon pack" --notes "Dark squircle icon pack APK" --repo "${{ github.repository }}"
